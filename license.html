<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"> -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Megrim&display=swap"
        rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Lato', 'sans-serif'],
                        logo: ['Megrim', 'cursive'],
                    },
                    colors: {
                        blue: '#8caaee',
                        base: '#24273a',
                        text: '#cad3f5',
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-base text-text font-sans antialiased flex flex-col min-h-screen">

    <nav class="w-full py-6 px-6 lg:px-12 flex justify-between items-center max-w-7xl mx-auto">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10">
                <img src="img/logo.png" alt="App Logo"">
            </div>
            <span class=" text-2xl font-logo">speciaList</span>
            </div>
            <a href="mailto:info@wbo-specialist.de" class="text-sm font-semibold text-text hover:text-blue transition">
                Contact Support
            </a>
    </nav>

    <main class="w-full mx-auto flex-grow flex flex-col items-center pt-16 pb-24 px-6 lg:pt-22 text-l">

        <h1 class="text-3xl font-bold mb-10 text-blue">Open Source Licenses</h1>

        <ul class="w-full space-y-6 text-left">

            <li class="flex items-start gap-3">
                <span class="text-blue mt-1">•</span>
                <span>
                    Palette by <a href="https://catppuccin.com" target="_blank"
                        class="font-bold hover:text-blue underline decoration-blue/30 underline-offset-4 transition">Catppuccin</a>
                    <span class="block text-sm opacity-60">Used under MIT License</span>
                </span>
            </li>

            <li class="flex items-start gap-3">
                <span class="text-blue mt-1">•</span>
                <span>
                    Paywall Header by <a href="https://www.flaticon.com" target="_blank"
                        class="font-bold hover:text-blue underline decoration-blue/30 underline-offset-4 transition">themefire</a>
                    <span class="block text-sm opacity-60">Used under CC BY 4.0</span>
                </span>
            </li>

            <li class="flex items-start gap-3">
                <span class="text-blue mt-1">•</span>
                <span>
                    Font <a href="https://fonts.google.com/specimen/Megrim?query=Daniel+Johnson" target="_blank"
                        class="font-bold hover:text-blue underline decoration-blue/30 underline-offset-4 transition">Megrim</a>
                    <span class="block text-sm opacity-60">Used under OFL 1.1</span>
                </span>
            </li>

        </ul>


    </main>

    <footer class="w-full py-4">
        <div
            class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-4 text-sm text-text">
            <div>
                &copy; 2026 speciaList. All rights reserved.
            </div>

            <div class="flex gap-6">
                <a href="/impressum" class="hover:text-blue transition">Impressum</a>
                <a href="/terms" class="hover:text-blue transition">AGB</a>
                <a href="/privacy" class="hover:text-blue transition">Datenschutzerklärung</a>
                <a href="/license" class="hover:text-blue transition">Open-Source-Lizenzen</a>
            </div>
        </div>
    </footer>

</body>

</html>
